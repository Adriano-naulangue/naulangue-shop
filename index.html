<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naulangue-Shop v3.8 Segura</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f6f6f6;padding-bottom:80px}
header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px;line-height:1.1}
.cart-btn{background:#fff;color:#111;border:none;padding:8px 14px;border-radius:20px;font-weight:700;font-size:13px}
.view{display:none;padding:12px}.view.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card img{width:100%;height:190px;object-fit:cover}
.card-info{padding:10px}
.btn{width:100%;padding:11px;border:none;border-radius:10px;font-weight:700;margin-top:6px;cursor:pointer}
.btn-black{background:#111;color:#fff}.btn-red{background:#25D366;color:#fff}.btn-outline{background:#fff;border:1px solid #ddd}
.detail-img{width:100%;height:360px;object-fit:cover;border-radius:16px}
.thumbs{display:flex;gap:8px;overflow:auto;margin:10px 0}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:2px solid transparent}
.thumbs img.active{border-color:#111}
.sizes{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.size{padding:8px 14px;border:1px solid #ddd;border-radius:20px;background:#fff}
.size.active{background:#111;color:#fff}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;background:#fff}
.prod-row{display:flex;gap:10px;align-items:center;background:#fff;padding:10px;border-radius:12px;margin-bottom:8px}
.badge{font-size:11px;background:#111;color:#fff;padding:3px 8px;border-radius:20px}
.chat-fab{position:fixed;bottom:18px;right:18px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;border:none;font-size:26px;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.chat-window{position:fixed;bottom:85px;right:12px;width:94%;max-width:380px;height:460px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;display:none;flex-direction:column;overflow:hidden}
.chat-window.open{display:flex}
.chat-header{background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.chat-messages{flex:1;overflow:auto;padding:10px;background:#ece5dd;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13px}
.msg.cliente{align-self:flex-end;background:#dcf8c6}
.msg.admin{align-self:flex-start;background:#fff}
.chat-input{display:flex;gap:6px;padding:8px;background:#f0f0f0}
.chat-count{position:absolute;top:-4px;right:-4px;background:#e63946;color:#fff;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
#loginBox{max-width:360px;margin:80px auto;background:#fff;padding:20px;border-radius:16px;text-align:center}
</style>
</head>
<body>
<header style="background-image: url('https://i.postimg.cc/L8Nqc06c/IMG-20261024-WA0119.jpg'); background-size: cover; background-position: center; position: relative;"><div style="position:absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6);"></div><h1 style="position:relative; z-index:2;">NAULANGUE-<br>SHOP</h1><div style="display:flex; gap:6px; position:relative; z-index:2;"><button class="cart-btn" onclick="showView('loja')">Loja</button><button class="cart-btn" onclick="showView('carrinho')">🛒 <span id="cartCount">0</span></button><button class="cart-btn" style="background:#e63946;color:#fff" onclick="showView('admin')">Admin</button></div></header>
  <p>Roupas que chega até cê- Rápido e seguro</p>
</div>
<div id="view-loja" class="view active"><div style="display:flex;gap:8px;margin-bottom:10px"><select id="filtroCat" onchange="renderLoja()"><option value="todos">Todas categorias</option><option>Camisas</option><option>Vestidos</option><option>Capulanas</option><option>Calções</option></select><select id="filtroTamanho" onchange="renderLoja()"><option value="todos">Todos tamanhos</option><option>XL</option><option>L</option><option>M</option><option>2XL</option><option>XX</option></select></div><div id="gridLoja" class="grid"></div></div>
<div id="view-detalhe" class="view"><button class="btn btn-outline" onclick="showView('loja')" style="width:auto">← Voltar</button><img id="dImg" class="detail-img" src=""><div id="dThumbs" class="thumbs"></div><h2 id="dNome"></h2><p id="dPreco" style="font-size:22px;font-weight:800;color:#e63946"></p><p id="dDesc" style="color:#555"></p><div id="dSizes" class="sizes"></div><button class="btn btn-black" onclick="addToCart()">Adicionar ao Carrinho</button><button class="btn btn-red" onclick="comprarAgora()">💬 WhatsApp 856661893</button></div>
<div id="view-carrinho" class="view"><h2>Seu Carrinho</h2><div id="listaCarrinho"></div><div id="totalBox" style="margin-top:12px;background:#fff;padding:12px;border-radius:12px;font-weight:800"></div><button class="btn btn-red" onclick="finalizarWhats()">💬 Finalizar WhatsApp</button></div>
<div id="view-login" class="view"><div id="loginBox"><h2>🔒 Admin Naulangue</h2><p style="font-size:13px;color:#666;margin:10px 0">Digite a senha:</p><input id="inputSenhaAdmin" placeholder="Senha" type="password"><button class="btn btn-black" onclick="loginAdmin()">Entrar</button><p id="loginErro" style="color:red;font-size:12px;margin-top:8px"></p><button class="btn btn-outline" onclick="showView('loja')">Voltar à Loja</button></div></div>
<div id="view-admin" class="view"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Painel Admin</h2><button class="btn btn-outline" style="width:auto" onclick="logoutAdmin()">Sair</button></div><div style="background:#fff;padding:12px;border-radius:14px;margin:12px 0;border:2px solid #25D366"><h3>💬 Conversa com Clientes (<span id="chatCountAdmin">0</span>)</h3><div id="adminChatMessages" style="max-height:300px;overflow:auto;background:#ece5dd;padding:8px;border-radius:10px;margin:8px 0;display:flex;flex-direction:column;gap:6px"></div><div style="display:flex;gap:6px"><input id="adminChatInput" placeholder="Responder ao cliente..."><button class="btn btn-black" style="width:80px;margin:0" onclick="adminResponder()">Enviar</button></div><button class="btn btn-outline" onclick="limparChat()" style="margin-top:6px;font-size:11px">Limpar Conversas</button></div><div style="background:#fff;padding:12px;border-radius:14px;margin-bottom:12px"><h3>➕ Adicionar Produto</h3><input id="pNome" placeholder="Nome do produto"><input id="pPreco" placeholder="Preço MT" type="number"><select id="pCat"><option>Camisas</option><option>Vestidos</option><option>Capulanas</option><option>Conjuntos</option></select><input id="pTamanhos" placeholder="Tamanhos ex: P,M,G,GG"><textarea id="pDesc" placeholder="Descrição"></textarea><label style="font-size:13px;font-weight:700">Fotos (várias):</label><input id="pFotos" type="file" accept="image/*" multiple><div id="previewFotos" class="thumbs"></div><button class="btn btn-black" onclick="salvarProduto()">Salvar Produto</button></div><h3>📦 Produtos (<span id="countProdutos">0</span>)</h3><div id="listaAdmin"></div></div>
<button class="chat-fab" onclick="toggleChat()"><span style="position:relative">💬<span id="chatBadge" class="chat-count" style="display:none">0</span></span></button>
<div id="chatWindow" class="chat-window"><div class="chat-header"><div><b>💬 Falar com Admin</b><br><small style="font-size:11px">Normalmente responde em minutos</small></div><button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:22px">×</button></div><div id="chatMessages" class="chat-messages"></div><div class="chat-input"><input id="chatInput" placeholder="Escreva sua mensagem..."><button class="btn btn-black" style="width:60px;margin:0" onclick="enviarMensagem()">▶</button></div></div>
<script>
const ADMIN_SENHA="Naulangue";const WHATSAPP_VENDAS="258856661893";
let produtos=JSON.parse(localStorage.getItem('naulangue_v38')||'[]');let carrinho=JSON.parse(localStorage.getItem('naulangue_cart_v38')||'[]');let chats=JSON.parse(localStorage.getItem('naulangue_chat_v38')||'[]');
let produtoAtivo=null,tamanhoAtivo=null,fotoAtivaIndex=0,fotosTemp=[];
if(produtos.length==0){produtos=[{id:1,nome:"Camisa Capulana Premium",preco:1500,cat:"Camisas",tamanhos:["P","M","G"],desc:"100% algodão moçambicano",fotos:["https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600"]}];salvarStorage();}
function salvarStorage(){localStorage.setItem('naulangue_v38',JSON.stringify(produtos));localStorage.setItem('naulangue_cart_v38',JSON.stringify(carrinho));localStorage.setItem('naulangue_chat_v38',JSON.stringify(chats));updateCartCount();updateChatBadge();}
function showView(nome){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));if(nome=='admin'){if(localStorage.getItem('naulangue_admin_logado')==='1'){document.getElementById('view-admin').classList.add('active');renderAdmin();renderAdminChat();}else{document.getElementById('view-login').classList.add('active');}}else{document.getElementById('view-'+nome).classList.add('active');if(nome=='loja')renderLoja();if(nome=='carrinho')renderCarrinho();}}
function updateCartCount(){document.getElementById('cartCount').innerText=carrinho.length;}
function updateChatBadge(){let unread=chats.filter(c=>c.tipo==='cliente').length;let badge=document.getElementById('chatBadge');if(unread>0){badge.style.display='flex';badge.innerText=unread;}else badge.style.display='none';document.getElementById('chatCountAdmin').innerText=chats.length;}
function renderLoja(){const cat=document.getElementById('filtroCat').value;const tam=document.getElementById('filtroTamanho').value;const grid=document.getElementById('gridLoja');grid.innerHTML='';produtos.filter(p=>{let okCat=cat=='todos'||p.cat==cat;let okTam=tam=='todos'||p.tamanhos.includes(tam);return okCat&&okTam;}).forEach(p=>{grid.innerHTML+=`<div class="card" onclick="abrirDetalhe(${p.id})"><img src="${p.fotos[0]}"><div class="card-info"><h3>${p.nome}</h3><p>${p.preco} MT</p><span class="badge">${p.fotos.length} fotos</span></div></div>`;});}
function abrirDetalhe(id){produtoAtivo=produtos.find(p=>p.id==id);tamanhoAtivo=produtoAtivo.tamanhos[0];fotoAtivaIndex=0;document.getElementById('dImg').src=produtoAtivo.fotos[0];document.getElementById('dNome').innerText=produtoAtivo.nome;document.getElementById('dPreco').innerText=produtoAtivo.preco+' MT';document.getElementById('dDesc').innerText=produtoAtivo.desc;let thumbs=document.getElementById('dThumbs');thumbs.innerHTML='';produtoAtivo.fotos.forEach((f,i)=>{thumbs.innerHTML+=`<img src="${f}" class="${i==0?'active':''}" onclick="trocarFoto(${i})" id="thumb${i}">`;});let sizes=document.getElementById('dSizes');sizes.innerHTML='';produtoAtivo.tamanhos.forEach(t=>{sizes.innerHTML+=`<div class="size ${t==tamanhoAtivo?'active':''}" onclick="escolherTamanho(this,'${t}')">${t}</div>`;});showView('detalhe');}
function trocarFoto(i){fotoAtivaIndex=i;document.getElementById('dImg').src=produtoAtivo.fotos[i];document.querySelectorAll('#dThumbs img').forEach(im=>im.classList.remove('active'));document.getElementById('thumb'+i).classList.add('active');}
function escolherTamanho(el,t){tamanhoAtivo=t;document.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));el.classList.add('active');}
function addToCart(){carrinho.push({id:Date.now(),nome:produtoAtivo.nome,preco:produtoAtivo.preco,foto:produtoAtivo.fotos[fotoAtivaIndex],tamanho:tamanhoAtivo});salvarStorage();alert('Adicionado! 🛒');}
function comprarAgora(){let msg=`Olá Naulangue! Quero comprar: ${produtoAtivo.nome} (${tamanhoAtivo}) - ${produtoAtivo.preco} MT`;window.open(`https://wa.me/${WHATSAPP_VENDAS}?text=${msg}`,'_blank');}
function renderCarrinho(){let lista=document.getElementById('listaCarrinho');lista.innerHTML='';let total=0;carrinho.forEach((c,i)=>{total+=parseInt(c.preco);lista.innerHTML+=`<div class="prod-row"><img src="${c.foto}"><div style="flex:1"><b>${c.nome}</b><br><small>${c.tamanho} - ${c.preco} MT</small></div><button onclick="removerCarrinho(${i})" style="background:#e63946;color:#fff;border:none;padding:6px 10px;border-radius:8px">X</button></div>`;});document.getElementById('totalBox').innerText='Total: '+total+' MT - '+carrinho.length+' itens';}
function removerCarrinho(i){carrinho.splice(i,1);salvarStorage();renderCarrinho();}
function finalizarWhats(){if(carrinho.length==0)return alert('Carrinho vazio');let msg='Olá Naulangue! Quero comprar:%0A';let total=0;carrinho.forEach(c=>{msg+=`- ${c.nome} (${c.tamanho}) - ${c.preco} MT%0A`;total+=parseInt(c.preco);});msg+=`%0ATotal: ${total} MT`;window.open(`https://wa.me/${WHATSAPP_VENDAS}?text=${msg}`,'_blank');}
function toggleChat(){let w=document.getElementById('chatWindow');w.classList.toggle('open');renderChat();}
function renderChat(){let box=document.getElementById('chatMessages');box.innerHTML='';if(chats.length==0)box.innerHTML='<div style="text-align:center;margin-top:30px;color:#888;font-size:13px">👋 Olá! Fale com a gente!<br>Estamos prontos para ajudar.</div>';chats.forEach(c=>{box.innerHTML+=`<div class="msg ${c.tipo}"><b>${c.tipo=='cliente'?'Você':'Admin'}:</b> ${c.texto}<br><small style="font-size:10px;opacity:.6">${c.hora}</small></div>`;});box.scrollTop=box.scrollHeight;}
function renderAdminChat(){let box=document.getElementById('adminChatMessages');box.innerHTML='';if(chats.length==0)box.innerHTML='<small style="color:#888">Nenhuma mensagem de clientes ainda</small>';chats.forEach(c=>{box.innerHTML+=`<div class="msg ${c.tipo}" style="max-width:90%"><b>${c.tipo}:</b> ${c.texto}<br><small>${c.hora}</small></div>`;});box.scrollTop=box.scrollHeight;}
function enviarMensagem(){let input=document.getElementById('chatInput');let texto=input.value.trim();if(!texto)return;let now=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});chats.push({tipo:'cliente',texto,hora:now});input.value='';salvarStorage();renderChat();renderAdminChat();}
function adminResponder(){let input=document.getElementById('adminChatInput');let texto=input.value.trim();if(!texto)return;let now=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});chats.push({tipo:'admin',texto,hora:now});input.value='';salvarStorage();renderChat();renderAdminChat();}
function limparChat(){if(confirm('Limpar todas conversas?')){chats=[];salvarStorage();renderChat();renderAdminChat();}}
document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter')enviarMensagem();});
document.getElementById('pFotos').addEventListener('change',function(e){fotosTemp=[];let preview=document.getElementById('previewFotos');preview.innerHTML='';Array.from(e.target.files).forEach(file=>{let reader=new FileReader();reader.onload=function(ev){fotosTemp.push(ev.target.result);preview.innerHTML+=`<img src="${ev.target.result}" style="width:60px;height:60px;border-radius:8px;object-fit:cover">`;};reader.readAsDataURL(file);});});
function loginAdmin(){let senha=document.getElementById('inputSenhaAdmin').value;if(senha===ADMIN_SENHA){localStorage.setItem('naulangue_admin_logado','1');document.getElementById('loginErro').innerText='';showView('admin');}else{document.getElementById('loginErro').innerText='Senha incorreta!';}}
function logoutAdmin(){localStorage.removeItem('naulangue_admin_logado');showView('loja');}
function salvarProduto(){let nome=document.getElementById('pNome').value;let preco=document.getElementById('pPreco').value;let cat=document.getElementById('pCat').value;let tams=document.getElementById('pTamanhos').value.split(',').map(s=>s.trim()).filter(s=>s);let desc=document.getElementById('pDesc').value;if(!nome||!preco||fotosTemp.length==0)return alert('Preencha nome, preço e foto!');let novo={id:Date.now(),nome,preco:parseInt(preco),cat,tamanhos:tams,desc,fotos:[...fotosTemp]};produtos.unshift(novo);salvarStorage();fotosTemp=[];document.getElementById('previewFotos').innerHTML='';document.getElementById('pFotos').value='';document.getElementById('pNome').value='';document.getElementById('pPreco').value='';document.getElementById('pTamanhos').value='';document.getElementById('pDesc').value='';renderAdmin();alert('Produto salvo!');}
function renderAdmin(){document.getElementById('countProdutos').innerText=produtos.length;let lista=document.getElementById('listaAdmin');lista.innerHTML='';produtos.forEach(p=>{let fotosHtml=p.fotos.map((f,i)=>`<div style="position:relative;display:inline-block;margin:2px"><img src="${f}" style="width:50px;height:50px;border-radius:6px;object-fit:cover"><button onclick="apagarFoto(${p.id},${i})" style="position:absolute;top:-6px;right:-6px;background:red;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px">x</button></div>`).join('');lista.innerHTML+=`<div class="prod-row" style="flex-direction:column;align-items:stretch"><div style="display:flex;gap:10px;align-items:center"><img src="${p.fotos[0]}"><div style="flex:1"><b>${p.nome}</b><br><small>${p.preco} MT</small></div><button onclick="apagarProduto(${p.id})" style="background:#111;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:12px">🗑️ APAGAR</button></div><div style="margin-top:8px"><small>Fotos:</small><br>${fotosHtml}</div></div>`;});}
function apagarProduto(id){if(confirm('Apagar produto?')){produtos=produtos.filter(p=>p.id!==id);salvarStorage();renderAdmin();renderLoja();}}
function apagarFoto(prodId,fotoIndex){let prod=produtos.find(p=>p.id==prodId);if(prod.fotos.length==1)return alert('Não pode apagar última foto!');if(confirm('Apagar esta foto?')){prod.fotos.splice(fotoIndex,1);salvarStorage();renderAdmin();}}
renderLoja();updateCartCount();updateChatBadge();renderChat();
</script>
</body>
</html>
