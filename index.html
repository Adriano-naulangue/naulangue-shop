<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naulangue Shop - Loja Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f8f8;color:#111}
header{background:#111;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;font-weight:800}
.cart-btn{background:#fff;color:#111;border:0;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.hero{background:#111;color:#fff;padding:30px 20px;text-align:center}
.hero h2{font-size:28px;margin-bottom:8px}
.hero p{opacity:.7}
.container{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;flex-direction:column}
.card img{width:100%;height:160px;object-fit:cover;background:#eee}
.card-body{padding:12px;flex:1;display:flex;flex-direction:column}
.card-body h3{font-size:14px;height:34px;overflow:hidden}
.price{font-weight:800;margin:8px 0;font-size:16px}
.stock{font-size:11px;padding:3px 8px;border-radius:99px;width:fit-content}
.stock.ok{background:#dcfce7;color:#166534}
.stock.low{background:#fef9c3;color:#854d0e}
.stock.out{background:#fee2e2;color:#991b1b}
.btn{margin-top:auto;background:#111;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:disabled{background:#ddd;color:#888;cursor:not-allowed}
.cart-panel{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#fff;z-index:200;transition:.3s;box-shadow:-10px 0 30px rgba(0,0,0,.1);display:flex;flex-direction:column}
.cart-panel.open{right:0}
.cart-header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.cart-items{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.cart-item{display:flex;gap:10px;align-items:center;background:#f9f9f9;padding:10px;border-radius:12px}
.cart-item img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.cart-footer{padding:20px;border-top:1px solid #eee}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.admin-fab{position:fixed;bottom:20px;left:20px;background:#111;color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer;z-index:90}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:24px;max-height:90vh;overflow:auto}
.badge{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rel{position:relative}
</style>
</head>
<body>
<header>
<h1>NAULANGUE SHOP</h1>
<div class="rel">
<button class="cart-btn" onclick="toggleCart()">🛒 Carrinho</button>
<div id="cartCount" class="badge" style="display:none">0</div>
</div>
</header>
<div class="hero">
<h2>Produtos Originais em Moçambique</h2>
<p>Entrega em Maputo, Matola e envio nacional • Estoque em tempo real</p>
</div>
<div class="container">
<div id="loading">Carregando produtos...</div>
<div id="grid" class="grid"></div>
</div>
<div id="cartPanel" class="cart-panel">
<div class="cart-header">
<h3>Seu Carrinho</h3>
<button onclick="toggleCart()" style="border:0;background:0;font-size:22px">×</button>
</div>
<div id="cartItems" class="cart-items"></div>
<div class="cart-footer">
<div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px">
<span>Total:</span><span id="cartTotal">0 MT</span>
</div>
<input id="clientName" class="input" placeholder="Seu nome completo">
<input id="clientPhone" class="input" placeholder="Seu WhatsApp (84... )">
<input id="clientAddr" class="input" placeholder="Bairro / Endereço">
<button class="btn" style="width:100%;background:#25D366" onclick="finalizarPedido()">Finalizar no WhatsApp</button>
<p style="font-size:11px;color:#666;margin-top:8px;text-align:center">Estoque baixa automaticamente</p>
</div>
</div>
<button class="admin-fab" onclick="openAdmin()">⚙️</button>
<div id="adminModal" class="modal">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h3>Adicionar Produto (Admin)</h3>
<button onclick="closeAdmin()" style="border:0;background:0;font-size:22px">×</button>
</div>
<input id="pName" class="input" placeholder="Nome do produto">
<input id="pPrice" class="input" type="number" placeholder="Preço em MT">
<input id="pStock" class="input" type="number" placeholder="Estoque (quantidade)">
<input id="pImage" class="input" placeholder="Link da imagem (https://...)">
<input id="pCat" class="input" placeholder="Categoria">
<button class="btn" style="width:100%" onclick="addProduct()">Salvar no Firebase</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot, query, orderBy, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBCWrloL--CRxPV4rL67uUvAyS2zqCZl7g",
  authDomain: "naulangue-shop.firebaseapp.com",
  projectId: "naulangue-shop",
  storageBucket: "naulangue-shop.firebasestorage.app",
  messagingSenderId: "695749077994",
  appId: "1:695749077994:web:2b0549a24595ba944c6093",
  measurementId: "G-2MG0G54PW1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let products = [];
let cart = [];
const grid = document.getElementById('grid');
const loading = document.getElementById('loading');
function render(){
  grid.innerHTML='';
  if(products.length===0){ loading.innerHTML='Nenhum produto ainda. Clique ⚙️ para adicionar o primeiro!'; return; }
  loading.style.display='none';
  products.forEach(p=>{
    const s = p.stock>10 ? `<span class="stock ok">${p.stock} em estoque</span>` : p.stock>0 ? `<span class="stock low">Só ${p.stock} restantes!</span>` : `<span class="stock out">Esgotado</span>`;
    const btn = p.stock<=0 ? `<button class="btn" disabled>Esgotado</button>` : `<button class="btn" onclick="addToCart('${p.id}')">Adicionar</button>`;
    grid.innerHTML+=`<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300?text=Sem+Imagem'"><div class="card-body"><h3>${p.name}</h3>${s}<div class="price">${Number(p.price).toLocaleString()} MT</div>${btn}</div></div>`;
  });
}
const q = query(collection(db,"products"), orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{
  products = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
window.addToCart = (id)=>{
  const prod = products.find(x=>x.id===id);
  if(!prod || prod.stock<=0) return alert('Produto sem estoque!');
  const inCart = cart.find(c=>c.id===id);
  if(inCart){
    if(inCart.qty >= prod.stock) return alert('Você já tem todo estoque no carrinho!');
    inCart.qty++;
  } else {
    cart.push({...prod, qty:1});
  }
  updateCartUI();
  toggleCart(true);
}
window.updateCartUI = ()=>{
  const count = cart.reduce((a,b)=>a+b.qty,0);
  const badge = document.getElementById('cartCount');
  if(count>0){ badge.style.display='flex'; badge.innerText=count; } else badge.style.display='none';
  const itemsDiv = document.getElementById('cartItems');
  itemsDiv.innerHTML = cart.length===0?'<p style="text-align:center;color:#888;margin-top:40px">Carrinho vazio</p>':'';
  let total=0;
  cart.forEach(c=>{
    total+=c.price*c.qty;
    itemsDiv.innerHTML+=`<div class="cart-item"><img src="${c.image}"><div style="flex:1"><div style="font-size:13px;font-weight:600">${c.name}</div><div style="font-size:12px">${c.price} MT x ${c.qty}</div></div><button onclick="removeCart('${c.id}')" style="border:0;background:#fee2e2;color:#991b1b;width:28px;height:28px;border-radius:50%">×</button></div>`;
  });
  document.getElementById('cartTotal').innerText=total.toLocaleString()+' MT';
}
window.removeCart = (id)=>{ cart = cart.filter(c=>c.id!==id); updateCartUI(); }
window.toggleCart = (forceOpen)=>{
  const p = document.getElementById('cartPanel');
  if(forceOpen===true) p.classList.add('open');
  else p.classList.toggle('open');
}
window.finalizarPedido = async ()=>{
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const addr = document.getElementById('clientAddr').value.trim();
  if(cart.length===0) return alert('Carrinho vazio');
  if(!name || !phone) return alert('Preencha nome e WhatsApp');
  try{
    for(const item of cart){
      const prodRef = doc(db,"products",item.id);
      await runTransaction(db, async (t)=>{
        const snap = await t.get(prodRef);
        if(!snap.exists()) throw "Produto não existe";
        const curStock = snap.data().stock;
        if(curStock < item.qty) throw `Só temos ${curStock} de ${snap.data().name}`;
        t.update(prodRef, {stock: curStock - item.qty});
      });
    }
    await addDoc(collection(db,"orders"),{name, phone, addr, items: cart, total: cart.reduce((a,b)=>a+b.price*b.qty,0), createdAt: new Date(), status: 'novo'});
    let msg = `*NOVO PEDIDO - NAULANGUE SHOP*%0A%0ACliente: ${name}%0AWhatsApp: ${phone}%0AEndereço: ${addr}%0A%0A*Itens:*%0A`;
    cart.forEach(c=>{ msg+=`• ${c.name} - ${c.qty}x ${c.price}MT = ${c.qty*c.price}MT%0A`; });
    msg+=`%0A*Total: ${cart.reduce((a,b)=>a+b.price*b.qty,0)} MT*`;
    window.open(`https://wa.me/258820000000?text=${msg}`,'_blank');
    cart=[]; updateCartUI(); toggleCart(false);
    alert('Pedido enviado! Estoque atualizado.');
  }catch(e){ alert('Erro: '+e); }
}
window.openAdmin = ()=>document.getElementById('adminModal').classList.add('open');
window.closeAdmin = ()=>document.getElementById('adminModal').classList.remove('open');
window.addProduct = async ()=>{
  const name=document.getElementById('pName').value.trim();
  const price=Number(document.getElementById('pPrice').value);
  const stock=Number(document.getElementById('pStock').value);
  const image=document.getElementById('pImage').value.trim();
  const category=document.getElementById('pCat').value.trim()||'geral';
  if(!name || !price || isNaN(stock) || !image) return alert('Preencha nome, preço, estoque e imagem');
  await addDoc(collection(db,"products"),{name,price,stock,image,category,createdAt:new Date()});
  alert('Produto adicionado! Já aparece na loja.');
  closeAdmin();
  document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pStock').value='';document.getElementById('pImage').value='';
}
</script>
</body>
</html>
