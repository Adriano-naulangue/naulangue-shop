<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFIOSO-STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.banner-foto{
  position:relative;
  width:100%;
  height:175px;
  overflow:hidden;
  background:#000;
  background-image:url('https://i.postimg.cc/dVS872Dz/WA-1792963145462.jpg');
  background-size:cover;
  background-position:center 20%
}
.banner-foto::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.1) 75%)
}
.banner-foto .conteudo{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  z-index:2
}
.banner-foto h1{
  color:#fff;
  font-size:20px;
  font-weight:900;
  line-height:20px;
  text-transform:uppercase
}
.banner-foto p{
  color:#fff;
  font-size:11px;
  margin-top:4px;
  font-weight:600
}
.sec{padding:11px 0 11px 12px;border-bottom:1px solid #1a1a1a}
.sec h2{font-size:12px;margin-bottom:8px;padding-left:8px;border-left:3px solid #ff0040;text-transform:uppercase}
.grid{display:flex;gap:10px;overflow-x:auto;padding-right:12px;padding-bottom:6px}
.grid::-webkit-scrollbar{display:none}
.card{min-width:150px;max-width:150px;background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;flex-shrink:0;position:relative}
.badge{position:absolute;top:6px;left:6px;background:#ff0040;color:#fff;font-size:6px;font-weight:900;padding:3px 6px;border-radius:8px}
.img{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:11px;padding:6px 7px 2px;height:30px;overflow:hidden}
.preco{color:#ff0040;font-weight:900;padding:0 7px;font-size:12px}
.old{color:#888;font-size:9px;text-decoration:line-through;padding:0 7px 3px}
.btnAdd{width:92%;margin:4px 4% 8px;background:#ff0040;color:#fff;border:none;border-radius:16px;padding:7px;font-weight:bold;font-size:10px}
.app{max-width:430px;margin:0 auto;padding-bottom:70px;background:#000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:7px 0;border-top:1px solid #222;max-width:430px;margin:0 auto}
.nav div{font-size:9px;text-align:center}
#adminPanel{position:fixed;inset:0;background:#0a0a0a;z-index:300;display:none;overflow:auto}
.adminHead{background:#111;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0}
.adminCard{background:#1e1e1e;margin:10px;border-radius:14px;padding:14px;border:1px solid #333}
.inp,.sel{width:100%;padding:11px;border:1px solid #333;border-radius:10px;margin-bottom:8px;background:#2a2a2a;color:#fff;font-size:13px}
.btnAdmin{width:100%;background:#00c853;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:bold;margin-top:6px}
.loginBox{max-width:320px;margin:80px auto;background:#1e1e1e;padding:24px;border-radius:16px;text-align:center}
.previewWrap{display:flex;gap:8px;flex-wrap:wrap}
.previewBox{width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid #00c853}
.previewBox img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<div class="banner-foto" id="bannerTop">
<div class="conteudo">
<h1>MAFIOSO-STORE</h1>
<p>Faça sua escolha, encomenda já</p>
</div>
</div>
<div id="allSections"></div>
<div style="text-align:center;padding:14px;color:#555;font-size:9px">Admin: <u onclick="abrirAdmin()" style="color:#ff0040">clique aqui</u></div>
</div>
<div class="nav"><div style="color:#ff0040">🏠<br>Accueil</div><div style="color:#888">🔍<br>Catégorie</div><div style="color:#888">🛒<br>Panier <span id="cartCount" style="background:#ff0040;color:#fff;border-radius:50%;padding:2px 5px;font-size:8px;display:none">0</span></div><div style="color:#888" onclick="abrirAdmin()">👤<br>Compte</div></div>
<div id="adminPanel"><div class="adminHead"><h2>ADMIN</h2><button onclick="fecharAdmin()" style="background:#fff;color:#111;border:none;border-radius:8px;padding:8px 14px;font-weight:bold">X</button></div>
<div id="loginDiv" class="loginBox"><h3>🔒 Acesso</h3><input id="passInput" type="password" class="inp" placeholder="Senha"><button class="btnAdmin" onclick="fazerLogin()">ENTRAR</button></div>
<div id="adminContent" style="display:none">
<div class="adminCard" style="border-color:#00c853"><h3>➕ Publicar</h3>
<select id="pGrupo" class="sel">
<option value="Camisa m-comprida">👕 Camisa m-comprida</option>
<option value="Camisa m-curta">👕 Camisa m-curta</option>
<option value="Camisas">👕 Camisas</option>
<option value="Calções">🩳 Calções</option>
<option value="Calças">👖 Calças</option>
<option value="Colar">📿 Colar</option>
<option value="Sapatos">👟 Sapatos</option>
<option value="Saltos">👠 Saltos</option>
<option value="Bermudas">🩳 Bermudas</option>
<option value="Vestidos">👗 Vestidos</option>
<option value="Saias">👗 Saias</option>
<option value="Blusas">👚 Blusas</option>
<option value="Jaquetas">🧥 Jaquetas</option>
<option value="Sutiãs">👙 Sutiãs</option>
<option value="Conjuntos">👗 Conjuntos</option>
<option value="Óculos">🕶️ Óculos</option>
<option value="Outras roupas">👚 Outras roupas</option>
<option value="Delgados">Delgados</option>
</select>
<input type="file" id="fileInput" accept="image/*" multiple class="inp"><div id="previewWrap" class="previewWrap"></div><input id="pNome" class="inp" placeholder="Nome"><input id="pPreco" class="inp" type="number" placeholder="Preço"><input id="pOld" class="inp" type="number" placeholder="Preço antigo"><button id="btnPublicar" class="btnAdmin" onclick="publicarAuto()">📤 PUBLICAR</button>
<p style="font-size:10px;color:#888;margin-top:8px;text-align:center">🔥 Agora salva no FIREBASE - aparece em todos os celulares!</p>
</div>
<div class="adminCard"><h3>📦 Produtos (<span id="countProd">0</span>)</h3><div id="adminList"></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBCWrloL--CRxPV4rL67uUvAyS2zqCZl7g",
  authDomain: "naulangue-shop.firebaseapp.com",
  projectId: "naulangue-shop",
  storageBucket: "naulangue-shop.firebasestorage.app",
  messagingSenderId: "695749077994",
  appId: "1:695749077994:web:2b0549a24595ba944c6093",
  measurementId: "G-2MG0G54PW1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let products = [];
let cart = JSON.parse(localStorage.getItem('cart_final')||'[]');
let curImgs = [];
function carregarProdutos(){
  const q = query(collection(db,"products"), orderBy("createdAt","desc"));
  onSnapshot(q,(snap)=>{
    products = snap.docs.map(d=>({idFirebase:d.id, ...d.data()}));
    render();
    atualizarCarrinho();
  });
}
carregarProdutos();
function render(){
  let container=document.getElementById('allSections');
  if(products.length===0){
    container.innerHTML='<div style="padding:30px 20px;text-align:center;color:#666;font-size:11px">Nenhum produto ainda.<br>Admin e publique!</div>';
    document.getElementById('countProd').innerText='0';
    return;
  }
  container.innerHTML='';
  let grupos={};
  products.forEach((pr,idx)=>{
    let g=pr.grupo||'Delgados';
    if(!grupos[g])grupos[g]=[];
    grupos[g].push({pr,idx})
  });
  Object.keys(grupos).forEach(cat=>{
    let html='<div class="sec"><h2>'+cat+'</h2><div class="grid">';
    grupos[cat].forEach(item=>{
      let pr=item.pr;
      let img=pr.img?'<img src="'+pr.img+'">':'<span style="color:#999;font-size:10px">Foto</span>';
      html+='<div class="card"><span class="badge">MONTEPUEZ</span><div class="img">'+img+'</div><h3>'+pr.n+'</h3><div class="preco">'+pr.p+' MT</div><div class="old">'+(pr.o?pr.o+' MT':'')+'</div><button class="btnAdd" onclick="adicionar('+item.idx+')">Adicionar</button></div>';
    });
    html+='</div></div>';
    container.innerHTML+=html;
  });
  document.getElementById('countProd').innerText=products.length;
  let list=document.getElementById('adminList');
  list.innerHTML='';
  products.forEach(pr=>{
    let thumb=pr.img?'<img src="'+pr.img+'" style="width:50px;height:50px;object-fit:cover;border-radius:6px">':'👕';
    list.innerHTML+='<div style="display:flex;gap:8px;background:#2a2a2a;border-radius:10px;padding:8px;align-items:center;margin-bottom:6px">'+thumb+'<div style="flex:1"><b style="font-size:11px">'+pr.n+'</b> <span style="background:#6ab6ff;color:#fff;padding:2px 6px;border-radius:8px;font-size:8px">'+pr.grupo+'</span><br><span style="color:#ff2d55;font-size:11px">'+pr.p+' MT</span></div><button onclick="apagarFirebase(\''+pr.idFirebase+'\')" style="background:#ff0040;color:#fff;border:none;border-radius:6px;padding:6px 10px">X</button></div>';
  });
}
window.atualizarCarrinho = function(){
  let c = document.getElementById('cartCount');
  if(cart.length>0){ c.style.display='inline-block'; c.innerText=cart.length; } else { c.style.display='none'; }
}
window.adicionar = function(i){
  cart.push(products[i]);
  localStorage.setItem('cart_final',JSON.stringify(cart));
  atualizarCarrinho();
  alert('✅ Adicionado!');
}
window.abrirAdmin = function(){document.getElementById('adminPanel').style.display='block';}
window.fecharAdmin = function(){document.getElementById('adminPanel').style.display='none';}
window.fazerLogin = function(){
  let s=document.getElementById('passInput').value;
  let k='bWFmaW9zbzIwMjU=';
  if(btoa(s)===k){document.getElementById('loginDiv').style.display='none';document.getElementById('adminContent').style.display='block';}
  else{alert('Senha errada!');}
}
function comprimir(file,max,qual,cb){
  let r=new FileReader();
  r.onload=e=>{
    let img=new Image();
    img.onload=()=>{
      let c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',qual))
    };
    img.src=e.target.result
  };
  r.readAsDataURL(file);
}
document.getElementById('fileInput').addEventListener('change',e=>{
  let files=Array.from(e.target.files);
  curImgs=[];
  let wrap=document.getElementById('previewWrap');
  wrap.innerHTML='';
  files.forEach(f=>{
    comprimir(f,350,0.55,url=>{
      curImgs.push(url);
      let d=document.createElement('div');
      d.className='previewBox';
      d.innerHTML='<img src="'+url+'">';
      wrap.appendChild(d);
    });
  });
});
window.publicarAuto = async function(){
  let nome=document.getElementById('pNome').value.trim()||'Produto';
  let p=parseInt(document.getElementById('pPreco').value);
  let o=parseInt(document.getElementById('pOld').value)||0;
  let grupo=document.getElementById('pGrupo').value;
  if(!p){alert('Digita preço!');return;}
  if(curImgs.length===0){alert('Escolhe foto!');return;}
  let btn=document.getElementById('btnPublicar');
  btn.innerText='⏳ PUBLICANDO NO FIREBASE...';
  btn.disabled=true;
  try{
    for(let i=0;i<curImgs.length;i++){
      let n=curImgs.length>1?nome+' '+(i+1):nome;
      await addDoc(collection(db,"products"),{
        n:n, p:p, o:o||Math.round(p*1.5), img:curImgs[i], grupo:grupo,
        createdAt: new Date()
      });
    }
    document.getElementById('pNome').value='';
    document.getElementById('pPreco').value='';
    document.getElementById('pOld').value='';
    curImgs=[];
    document.getElementById('previewWrap').innerHTML='';
    document.getElementById('fileInput').value='';
    alert('✅ Publicado no FIREBASE! Agora aparece em todos os celulares!');
    fecharAdmin();
  }catch(err){ alert('Erro Firebase: '+err); }
  btn.innerText='📤 PUBLICAR';
  btn.disabled=false;
}
window.apagarFirebase = async function(idFirebase){
  if(confirm('Apagar do Firebase?')){
    await deleteDoc(doc(db,"products",idFirebase));
  }
}
</script>
</body>
</html>
