<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naulangue Tech | Learn English. Build Your Future.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243b;font:15px/1.55 Inter,system-ui,Arial,sans-serif}
button{cursor:pointer}.hidden{display:none!important}
.topbar{height:70px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}
.hamb{border:0;background:#eef3fb;border-radius:12px;width:42px;height:42px;font-size:22px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#102a56,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900;cursor:pointer}
.brandname{font-weight:900;color:#102a56;font-size:17px}.tagline{font-size:11px;color:#64748b;margin-top:-3px}
.top-spacer{flex:1}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:750}.btn-primary{background:#2563eb;color:#fff}.btn-light{background:#eef3fb;color:#102a56}.btn-outline{background:#fff;border:1px solid #e5eaf2;color:#102a56}.btn-gold{background:#d6a83d;color:#17243b}.btn-dark{background:#102a56;color:#fff}
.layout{display:flex;min-height:calc(100vh - 70px)}.sidebar{width:270px;background:#fff;border-right:1px solid #e5eaf2;padding:18px 13px;flex-shrink:0}
.sidebar.closed{width:0;padding:0;overflow:hidden;border:0}
.side-label{font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1.3px;padding:12px 12px 6px}
.navbtn,.navgroup{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:#334155;padding:11px 12px;border-radius:10px;font-weight:700}
.navbtn:hover,.navbtn.active{background:#eef4ff;color:#2563eb}.navgroup{justify-content:space-between;color:#102a56}
.subnav{padding-left:13px;display:grid;gap:3px}.subnav .navbtn{font-size:13px;padding:9px 12px}
.main{flex:1;min-width:0;padding:26px;max-width:1300px;margin:0 auto;width:100%}
</style>
</head>
<body>
<header class="topbar">
<button class="hamb" onclick="toggleMenu()">☰</button>
<div class="brand"><div class="logo" id="logo">NT</div><div><div class="brandname">NAULANGUE TECH</div><div class="tagline">Learn English. Build Your Future.</div></div></div>
<div class="top-spacer"></div>
<button class="btn btn-outline" onclick="showPage('login')">Entrar</button>
<button class="btn btn-primary" onclick="showPage('register')">Criar conta</button>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
<div class="side-label">NAVEGAÇÃO</div>
<button class="navbtn" onclick="showPage('home')">🏠 Painel inicial</button>
<div class="side-label">APRENDER INGLÊS</div>
<button class="navgroup" onclick="toggleGroup('beginner')"><span>⭐ INICIANTE</span><span>▼</span></button>
<div class="subnav" id="beginner">
<button class="navbtn" onclick="showPage('lesson','Alfabeto')">🔤 Alfabeto</button>
<button class="navbtn" onclick="showPage('lesson','Números')">🔢 Números</button>
<button class="navbtn" onclick="showPage('lesson','Diálogo')">💬 Diálogo</button>
<button class="navbtn" onclick="showPage('lesson','Verbos')">📖 Verbos</button>
</div>
<button class="navgroup" onclick="toggleGroup('courses')"><span>📚 CURSOS</span><span>▼</span></button>
<div class="subnav" id="courses">
<button class="navbtn" onclick="showPage('course','Básico')">📗 Básico – 10 MT</button>
<button class="navbtn" onclick="showPage('course','Intermediário')">📘 Intermediário – 20 MT</button>
<button class="navbtn" onclick="showPage('course','Médio')">📙 Médio – 30 MT</button>
<button class="navbtn" onclick="showPage('course','Avançado')">📕 Avançado – 40 MT</button>
<button class="navbtn" onclick="showPage('allcourses')">📚 Todos os Cursos</button>
</div>
<button class="navgroup" onclick="toggleGroup('tasks')"><span>📝 ÁREA DE TAREFAS</span><span>▼</span></button>
<div class="subnav" id="tasks">
<button class="navbtn" onclick="showPage('practice')">Aula prática</button>
<button class="navbtn" onclick="showPage('tests')">Testes</button>
<button class="navbtn" onclick="showPage('results')">Resultados</button>
</div>
<button class="navgroup" onclick="toggleGroup('publicity')"><span>📢 PUBLICIDADE</span><span>▼</span></button>
<div class="subnav" id="publicity">
<button class="navbtn" onclick="showPage('category','Novidades')">Novidades / Fotos</button>
<button class="navbtn" onclick="showPage('category','Frases do dia a dia')">Frases do dia a dia</button>
</div>
<button class="navgroup" onclick="toggleGroup('learn')"><span>📖 APRENDER</span><span>▼</span></button>
<div class="subnav" id="learn">
<button class="navbtn" onclick="showPage('lesson','O que é inglês?')">O que é inglês?</button>
<button class="navbtn" onclick="showPage('lesson','O que vais aprender?')">O que vais aprender?</button>
<button class="navbtn" onclick="showPage('lesson','Sala de aula')">Sala de aula</button>
</div>
<button class="navgroup" onclick="toggleGroup('help')"><span>💬 AJUDA</span><span>▼</span></button>
<div class="subnav" id="help">
<button class="navbtn" onclick="showPage('comments')">Comentários</button>
<button class="navbtn" onclick="showPage('messages')">Conversas</button>
<button class="navbtn" onclick="showPage('profile')">Meu perfil</button>
</div>
<button class="navbtn" onclick="showPage('progress')">📊 Meu progresso</button>
</aside>
<main class="main" id="main"></main>
</div>
<div style="text-align:center;padding:25px;color:#8190a5;font-size:12px">© 2026 Naulangue Tech · Plataforma de aprendizagem de inglês</div>
<div id="toast" class="hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#142d53;color:#fff;padding:12px 18px;border-radius:12px;z-index:60"></div>
<style>
.hero{background:linear-gradient(120deg,#102a56,#1e55a5 70%,#3677d8);color:#fff;border-radius:24px;padding:36px;display:grid;grid-template-columns:1.2fr .8fr;gap:25px;align-items:center;overflow:hidden}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#f4d98d;font-weight:900}
.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.08;margin:10px 0}.hero p{color:#dbeafe}
.hero-img{width:100%;height:230px;object-fit:cover;border-radius:18px;border:2px solid #ffffff40}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 14px}.section-head h2{margin:0;color:#102a56;font-size:22px}.muted{color:#64748b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:17px;padding:18px}
.post-card{padding:0;overflow:hidden;cursor:pointer}.post-img{height:150px;background:#dbeafe;display:grid;place-items:center;font-size:50px}.post-body{padding:16px}.post-body h3{margin:0 0 6px}
.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#eaf1ff;color:#1d4ed8;font-size:11px;font-weight:800}
.price{font-size:24px;font-weight:900;color:#16834a}.course-icon{width:48px;height:48px;border-radius:14px;background:#edf3ff;display:grid;place-items:center;font-size:25px}
.page-title{margin:0 0 6px;color:#102a56;font-size:27px}.page-desc{color:#64748b;margin:0 0 20px}
.form-card{max-width:620px;margin:10px auto;background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:25px}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:750;font-size:13px}
.field input,.field textarea,.field select,.input{width:100%;padding:12px 13px;border:1px solid #dbe2ed;border-radius:10px;outline:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:17px;border-radius:16px;background:#fff;border:1px solid #e5eaf2}.stat strong{display:block;font-size:27px;color:#102a56}
.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#16a34a}
.question{padding:16px;border:1px solid #e5eaf2;border-radius:13px;margin:12px 0;background:#fff}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.admin-menu{background:#102a56;color:#fff;border-radius:16px;padding:14px}.admin-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dbeafe;padding:10px;border-radius:9px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid,.two-col{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.sidebar{position:fixed;z-index:30;top:70px;bottom:0;left:0}.admin-layout{grid-template-columns:1fr}}
</style>
<script>
const courses=[{name:'Básico',price:10,icon:'📗',desc:'Vocabulário essencial, cumprimentos, frases simples e gramática inicial.'},{name:'Intermediário',price:20,icon:'📘',desc:'Conversação, tempos verbais, leitura e construção de frases.'},{name:'Médio',price:30,icon:'📙',desc:'Compreensão, escrita, gramática e comunicação variada.'},{name:'Avançado',price:40,icon:'📕',desc:'Fluência, expressão avançada, interpretação e comunicação profissional.'}];
const seedPosts=[{id:1,title:'Bem-vindo à Naulangue Tech!',category:'Novidades',body:'Aprende inglês ao teu ritmo. Acompanha as novidades e prepara o teu futuro connosco.',emoji:'🌍',date:'Hoje'},{id:2,title:'Frases úteis para o dia a dia',category:'Frases do dia a dia',body:'Good morning — Bom dia. How are you? — Como estás? Thank you — Obrigado/a.',emoji:'💬',date:'Hoje'},{id:3,title:'Aprender inglês abre oportunidades',category:'Novidades',body:'A prática diária ajuda a desenvolver vocabulário, compreensão e confiança.',emoji:'📚',date:'Hoje'}];
let posts=JSON.parse(localStorage.getItem('nt_posts')||'null')||seedPosts;
let user=JSON.parse(localStorage.getItem('nt_user')||'null');
let unlocked=JSON.parse(localStorage.getItem('nt_unlocked')||'[]');
let progress=JSON.parse(localStorage.getItem('nt_progress')||'{"lessons":[],"tests":[],"scores":[]}');
let adminTab='overview';let taps=[];
const $=s=>document.querySelector(s);
function save(){localStorage.setItem('nt_posts',JSON.stringify(posts));localStorage.setItem('nt_user',JSON.stringify(user));localStorage.setItem('nt_unlocked',JSON.stringify(unlocked));localStorage.setItem('nt_progress',JSON.stringify(progress))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function toggleMenu(){$('#sidebar').classList.toggle('closed')}
function toggleGroup(id){document.getElementById(id).classList.toggle('hidden')}
document.getElementById('logo').addEventListener('click',()=>{let now=Date.now();taps=taps.filter(t=>now-t<1500);taps.push(now);if(taps.length>=5){taps=[];showPage('adminLogin')}});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function postCard(p){return `<article class="card post-card" onclick="showPage('post',${p.id})"><div class="post-img">${p.emoji||'📘'}</div><div class="post-body"><span class="pill">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.body.slice(0,100))}</p><small class="muted">${esc(p.date||'')}</small></div></article>`}
function courseCard(c){return `<article class="card"><div class="course-icon">${c.icon}</div><h3>Curso ${c.name}</h3><div class="price">${c.price} MT</div><p class="muted">${c.desc}</p><button class="btn btn-primary" onclick="showPage('course','${c.name}')">${unlocked.includes(c.name)?'Aceder ao curso':'Ver curso'}</button></article>`}
<script>
function showPage(page,arg){
if(innerWidth<900 && !$('#sidebar').classList.contains('closed')) toggleMenu();
let main=$('#main');let pub=posts.slice().reverse();
if(page==='home'){
main.innerHTML=`<section class="hero"><div><div class="eyebrow">English learning platform</div><h1>Learn English.<br>Build Your Future.</h1><p>Aprende inglês com aulas, exercícios e conteúdos preparados para acompanhar o teu desenvolvimento.</p><button class="btn btn-gold" onclick="showPage('register')">Começar agora</button> <button class="btn btn-light" onclick="showPage('allcourses')">Ver cursos</button></div><div><img class="hero-img" src="https://i.postimg.cc/jjK7GFY6/file-000000000b88821191be7f7a49497912.png" alt="Estudante a aprender inglês"></div></section>
<div class="section-head"><div><h2>Novidades e publicações</h2><div class="muted">Conteúdos públicos para todos os visitantes</div></div><button class="btn btn-light" onclick="showPage('category','Novidades')">Ver todas</button></div><div class="grid">${pub.map(postCard).join('')}</div>
<div class="section-head"><div><h2>Conhece os nossos cursos</h2><div class="muted">Cria uma conta para escolher e desbloquear um curso.</div></div></div><div class="grid">${courses.map(courseCard).join('')}</div>`;
}
else if(page==='category'){let list=pub.filter(p=>p.category===arg);main.innerHTML=`<h1 class="page-title">${esc(arg)}</h1><p class="page-desc">Publicações disponíveis para qualquer visitante.</p><div class="grid">${list.map(postCard).join('')||'<div class="card">Ainda não existem publicações.</div>'}</div>`}
else if(page==='post'){let p=posts.find(x=>x.id===arg);main.innerHTML=`<button class="btn btn-light" onclick="showPage('home')">← Voltar</button><div class="card" style="margin-top:14px"><div class="post-img" style="height:200px;font-size:80px">${p.emoji}</div><p><span class="pill">${esc(p.category)}</span></p><h1 class="page-title">${esc(p.title)}</h1><p>${esc(p.body)}</p>${(p.images||[]).map(x=>`<img src="${x}" style="max-width:100%;border-radius:12px;margin:8px">`).join('')}</div>`}
else if(page==='register'){main.innerHTML=`<div class="form-card"><h1 class="page-title">Criar conta</h1><p class="page-desc">Regista-te para aceder às aulas e acompanhar o teu progresso.</p><form onsubmit="register(event)"><div class="field"><label>Nome completo</label><input name="name" required placeholder="O teu nome"></div><div class="field"><label>Telefone</label><input name="phone" required type="tel" placeholder="+258 8XXXXXXXX"></div><div class="field"><label>E-mail</label><input name="email" required type="email"></div><div class="field"><label>Palavra-passe</label><input name="password" required type="password" minlength="8"></div><div class="field"><label>Confirmar palavra-passe</label><input name="confirm" required type="password" minlength="8"></div><button class="btn btn-primary" style="width:100%">Criar conta</button></form><p class="muted">Já tens conta? <a href="#" onclick="showPage('login');return false">Entrar</a></p></div>`}
else if(page==='login'){main.innerHTML=`<div class="form-card"><h1 class="page-title">Iniciar sessão</h1><form onsubmit="login(event)"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Palavra-passe</label><input name="password" type="password" required></div><button class="btn btn-primary" style="width:100%">Entrar</button></form><p class="muted">Ainda não tens conta? <a href="#" onclick="showPage('register');return false">Criar conta</a></p></div>`}
else if(page==='course'){let c=courses.find(x=>x.name===arg);main.innerHTML=`<h1 class="page-title">${c.icon} Curso ${c.name}</h1><p class="page-desc">${c.desc}</p><div class="card"><div class="price">${c.price} MT</div><p>O curso fica disponível depois da confirmação do pagamento.</p><button class="btn btn-primary" onclick="startPayment('${c.name}')">Desbloquear curso</button></div>`}
else if(page==='allcourses'){main.innerHTML=`<h1 class="page-title">Todos os cursos</h1><p class="page-desc">Escolhe um curso depois de criares a tua conta.</p><div class="grid">${courses.map(courseCard).join('')}</div>`}
else if(page==='payment'){let c=courses.find(x=>x.name===arg);main.innerHTML=`<h1 class="page-title">Pagamento – ${c.name}</h1><p>Valor: <b>${c.price} MT</b></p><div class="two-col"><div class="card"><h3>M-Pesa</h3><h2>856 661 893</h2><p>Beneficiário: Adriano Naulange</p></div><div class="card"><h3>e-Mola</h3><h2>862 428 830</h2><p>Beneficiário: Adriano Naulange</p></div></div><div class="form-card" style="margin:16px 0"><form onsubmit="paymentRequest(event,'${c.name}')"><div class="field"><label>Carteira</label><select name="wallet"><option>M-Pesa</option><option>e-Mola</option></select></div><div class="field"><label>Número usado</label><input name="phone" required type="tel"></div><div class="field"><label>Referência</label><input name="ref"></div><button class="btn btn-primary">Enviar pedido ao administrador</button></form></div>`}
else if(page==='practice'||page==='tests'){let qs=page==='practice'?['Good morning.','How are you?','My name is John.','I am a student.','Thank you very much.','Good night.','I love English.','Where are you from?','See you tomorrow.','Welcome to school.']:['What is the English word for “casa”?','Translate: “I am happy.”','Choose greeting: “Bom dia”.','What is plural of “book”?','Translate: “Thank you”.','What does “teacher” mean?','Complete: I ___ a student.','Translate: “Good night”.','Opposite of “big”?','Translate: “See you soon”.'];main.innerHTML=`<h1 class="page-title">${page==='practice'?'Aula prática':'Testes'}</h1><form onsubmit="grade(event,'${page}')">${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${q}</b><input class="input" name="a${i}" required placeholder="A tua resposta"></div>`).join('')}<button class="btn btn-primary">Corrigir respostas</button></form>`}
else if(page==='results'){main.innerHTML=`<h1 class="page-title">Resultados</h1><div class="card"><p>Testes: <b>${progress.tests.length}</b></p>${progress.scores.map(s=>`<p>${esc(s.label)} — <b>${s.score}/10</b></p>`).join('')||'Ainda não há resultados.'}</div>`}
else if(page==='progress'){let pct=Math.min(100,Math.round((progress.lessons.length/12)*100));main.innerHTML=`<h1 class="page-title">Meu progresso</h1><div class="stat-grid"><div class="stat"><strong>${progress.lessons.length}</strong><span class="muted">Aulas concluídas</span></div><div class="stat"><strong>${progress.tests.length}</strong><span class="muted">Testes</span></div><div class="stat"><strong>${progress.scores.length?progress.scores[progress.scores.length-1].score+'/10':'—'}</strong><span class="muted">Última nota</span></div><div class="stat"><strong>${unlocked.length}</strong><span class="muted">Cursos</span></div></div><div class="card" style="margin-top:16px"><b>Progresso</b><h2>${pct}%</h2><div class="progress"><span style="width:${pct}%"></span></div></div><div class="card" style="margin-top:16px"><b>Cursos em andamento</b><p>${unlocked.join(', ')||'Ainda não tens cursos.'}</p></div>`}
else if(page==='lesson'){main.innerHTML=`<h1 class="page-title">${esc(arg)}</h1><div class="card"><p>Conteúdo: ${esc(arg)}.</p>${user?`<button class="btn btn-primary" onclick="completeLesson('${esc(arg)}')">Marcar como concluída</button>`:`<button class="btn btn-primary" onclick="showPage('register')">Criar conta para continuar</button>`}</div>`}
else if(page==='comments'||page==='messages'||page==='profile'){if(!user){main.innerHTML=`<div class="card"><h2>Área reservada</h2><p>Cria conta ou entra.</p><button class="btn btn-primary" onclick="showPage('login')">Entrar</button></div>`}else if(page==='profile'){main.innerHTML=`<h1 class="page-title">Meu perfil</h1><div class="card"><p><b>Nome:</b> ${esc(user.name)}</p><p><b>Telefone:</b> ${esc(user.phone)}</p><p><b>E-mail:</b> ${esc(user.email)}</p><button class="btn btn-outline" onclick="logout()">Terminar sessão</button></div>`}else{main.innerHTML=`<h1 class="page-title">${page==='comments'?'Comentários':'Conversas'}</h1><div class="card"><textarea class="input" placeholder="Escreve aqui..."></textarea><br><br><button class="btn btn-primary" onclick="toast('Mensagem registada.')">Enviar</button></div>`}}
else if(page==='adminLogin'){main.innerHTML=`<div class="form-card"><h1 class="page-title">Acesso administrativo</h1><form onsubmit="adminLogin(event)"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Palavra-passe</label><input name="password" type="password" required></div><button class="btn btn-dark" style="width:100%">Entrar no painel</button></form><p class="muted">Dica demo: usa admin@naulangue.com / 12345678 para testar. Depois ligamos ao Supabase.</p></div>`}
else if(page==='admin'){renderAdmin()}
else{main.innerHTML='<div class="card">Página em preparação.</div>'}
}
</script>
<script>
function register(e){e.preventDefault();let f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))return toast('As palavras-passe não coincidem.');user={name:f.get('name'),phone:f.get('phone'),email:f.get('email'),password:f.get('password')};save();toast('Conta criada!');showPage('progress')}
function login(e){e.preventDefault();let f=new FormData(e.target);if(user&&user.email===f.get('email')&&user.password===f.get('password')){toast('Bem-vindo '+user.name);showPage('progress')}else toast('Conta não encontrada. Cria uma conta.')}
function logout(){user=null;save();showPage('home');toast('Sessão terminada.')}
function startPayment(name){if(!user){toast('Cria conta primeiro.');return showPage('register')}showPage('payment',name)}
function paymentRequest(e,name){e.preventDefault();if(!unlocked.includes(name))unlocked.push(name);save();toast('Pedido enviado! Curso '+name+' desbloqueado para teste.');showPage('progress')}
function grade(e,type){e.preventDefault();let f=new FormData(e.target);let answers=Array.from({length:10},(_,i)=>String(f.get('a'+i)||'').trim().toLowerCase());let score=0;if(type==='practice'){let keys=['bom dia','como estás','meu nome é john','sou estudante','muito obrigado','boa noite','eu amo inglês','de onde és','até amanhã','bem-vindo'];score=answers.reduce((n,a,i)=>n+(a.includes(keys[i])?1:0),0)}else{let keys=['casa','eu estou feliz','good morning','books','obrigado','professor','am','boa noite','small','até breve'];score=answers.reduce((n,a,i)=>n+(a.includes(keys[i])?1:0),0)}progress.tests.push({type});progress.scores.push({label:type==='practice'?'Aula prática':'Teste',score});save();$('#main').innerHTML=`<div class="card"><h1 class="page-title">Resultado: ${score}/10</h1><p>${score>=7?'Muito bem! Continua.':'Continua a estudar e tenta de novo.'}</p><button class="btn btn-primary" onclick="showPage('progress')">Ver progresso</button></div>`}
function completeLesson(name){if(!progress.lessons.includes(name))progress.lessons.push(name);save();toast('Aula concluída.');showPage('progress')}
function adminLogin(e){e.preventDefault();let f=new FormData(e.target);if(f.get('email')==='admin@naulangue.com'&&f.get('password')==='12345678'){showPage('admin')}else toast('Dados de admin errados para demo.')}
function renderAdmin(){
let tabs=[['overview','Visão geral'],['posts','Publicações'],['courses','Cursos'],['students','Alunos']];
$('#main').innerHTML=`<div class="section-head"><div><span class="pill">PAINEL ADMINISTRATIVO</span><h1 class="page-title">Gestão Naulangue Tech</h1></div><button class="btn btn-outline" onclick="showPage('home')">Sair</button></div><div class="admin-layout"><nav class="admin-menu">${tabs.map(t=>`<button onclick="adminTab='${t[0]}';renderAdmin()">${t[1]}</button>`).join('')}</nav><section id="adminContent"></section></div>`;
let a=$('#adminContent');
if(adminTab==='overview')a.innerHTML=`<div class="stat-grid"><div class="stat"><strong>${posts.length}</strong>Publicações</div><div class="stat"><strong>${courses.length}</strong>Cursos</div><div class="stat"><strong>${user?1:0}</strong>Conta</div><div class="stat"><strong>${progress.tests.length}</strong>Testes</div></div><div class="card" style="margin-top:16px"><h3>Bem-vindo ao painel</h3><p>Gerir conteúdos aqui.</p></div>`;
else if(adminTab==='posts')a.innerHTML=`<div class="card"><h3>Criar publicação</h3><form onsubmit="createPost(event)"><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Categoria</label><select name="category"><option>Painel geral</option><option>Novidades</option><option>Frases do dia a dia</option><option>Iniciante</option><option>Cursos</option><option>Sala de aula</option></select></div><div class="field"><label>Conteúdo</label><textarea name="body" required></textarea></div><div class="field"><label>Emoji</label><input name="emoji" value="📘"></div><div class="field"><label>Fotografias</label><input name="images" type="file" accept="image/*" multiple></div><button class="btn btn-primary">Publicar</button></form></div><div class="card" style="margin-top:14px"><h3>Existentes</h3>${posts.map(p=>`<p>${esc(p.title)} · ${esc(p.category)} <button class="btn btn-light" onclick="deletePost(${p.id})">Eliminar</button></p>`).join('')}</div>`;
else if(adminTab==='courses')a.innerHTML=`<div class="card"><h3>Cursos</h3>${courses.map(c=>`<p>${c.icon} ${c.name} — ${c.price} MT</p>`).join('')}</div>`;
else a.innerHTML=`<div class="card"><h3>Alunos</h3><p>${user?esc(user.name)+' · '+esc(user.email):'Nenhuma conta.'}</p></div>`;
}
function createPost(e){e.preventDefault();let f=new FormData(e.target);let files=Array.from(e.target.images.files||[]);let p={id:Date.now(),title:f.get('title'),category:f.get('category'),body:f.get('body'),emoji:f.get('emoji')||'📘',date:new Date().toLocaleDateString(),images:[]};if(files.length){let count=0;files.slice(0,5).forEach(file=>{let r=new FileReader();r.onload=()=>{p.images.push(r.result);count++;if(count===Math.min(files.length,5)){posts.unshift(p);save();renderAdmin();toast('Publicado com foto.')}};r.readAsDataURL(file)})}else{posts.unshift(p);save();renderAdmin();toast('Publicado.')}}
function deletePost(id){posts=posts.filter(p=>p.id!==id);save();renderAdmin();toast('Eliminado.')}
</script>
<script>
showPage('home');
</script>
</body>
</html>
