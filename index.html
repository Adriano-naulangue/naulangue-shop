<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAULANGUE-SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.banner-foto{
  position:relative;
  width:100%;
  height:180px;
  overflow:hidden;
  background:#000;
  background-image:url('https://i.postimg.cc/gkgMD6xP/IMG-20261025-233519-084.jpg');
  background-size:cover;
  background-position:center 15%
}
.banner-foto::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.65) 38%, rgba(0,0,0,0.15) 75%)
}
.banner-foto .conteudo{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  z-index:2
}
.banner-foto h1{
  color:#fff;
  font-size:21px;
  font-weight:900;
  line-height:21px;
  text-transform:uppercase
}
.banner-foto p{
  color:#ffeb00;
  font-size:11px;
  margin-top:5px;
  font-weight:700
}
.sec{padding:11px 0 11px 12px;border-bottom:1px solid #1a1a1a}
.sec h2{font-size:12px;margin-bottom:8px;padding-left:8px;border-left:3px solid #ff0040;text-transform:uppercase}
.grid{display:flex;gap:10px;overflow-x:auto;padding-right:12px;padding-bottom:6px}
.grid::-webkit-scrollbar{display:none}
.card{min-width:150px;max-width:150px;background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;flex-shrink:0;position:relative}
.badge{position:absolute;top:6px;left:6px;background:#ff0040;color:#fff;font-size:6px;font-weight:900;padding:3px 6px;border-radius:8px}
.img{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:11px;padding:6px 7px 2px;height:30px;overflow:hidden}
.preco{color:#ff0040;font-weight:900;padding:0 7px;font-size:12px}
.btnWhatsCard{width:92%;margin:4px 4% 8px;background:#25D366;color:#fff;border:none;border-radius:16px;padding:8px;font-weight:bold;font-size:10px;display:flex;align-items:center;justify-content:center;gap:4px}
.app{max-width:430px;margin:0 auto;padding-bottom:70px;background:#000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:7px 0;border-top:1px solid #222;max-width:430px;margin:0 auto}
.nav div{font-size:9px;text-align:center}
#adminPanel{position:fixed;inset:0;background:#0a0a0a;z-index:300;display:none;overflow:auto}
.adminHead{background:#111;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0}
.adminCard{background:#1e1e1e;margin:10px;border-radius:14px;padding:14px;border:1px solid #333}
.inp,.sel{width:100%;padding:11px;border:1px solid #333;border-radius:10px;margin-bottom:8px;background:#2a2a2a;color:#fff;font-size:13px}
.btnAdmin{width:100%;background:#00c853;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:bold;margin-top:6px}
.loginBox{max-width:320px;margin:80px auto;background:#1e1e1e;padding:24px;border-radius:16px;text-align:center}
.previewWrap{display:flex;gap:8px;flex-wrap:wrap}
.previewBox{width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid #00c853}
.previewBox img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<div class="banner-foto">
<div class="conteudo">
<h1>NAULANGUE-SHOP</h1>
<p>Faça sua escolha, encomenda já</p>
</div>
</div>
<div id="allSections"></div>
<div style="text-align:center;padding:14px;color:#555;font-size:9px">WhatsApp: 846661893<br>Admin: <u onclick="abrirAdmin()" style="color:#ff0040">clique aqui</u></div>
</div>
<div class="nav"><div style="color:#ff0040">🏠<br>Accueil</div><div style="color:#888">🔍<br>Catégorie</div><div style="color:#888" onclick="abrirWhatsApp()">💬<br>WhatsApp</div><div style="color:#888" onclick="abrirAdmin()">👤<br>Compte</div></div>
<div id="adminPanel"><div class="adminHead"><h2>ADMIN</h2><button onclick="fecharAdmin()" style="background:#fff;color:#111;border:none;border-radius:8px;padding:8px 14px;font-weight:bold">X</button></div>
<div id="loginDiv" class="loginBox"><h3>🔒 Acesso</h3><input id="passInput" type="password" class="inp" placeholder="Digite a senha"><button class="btnAdmin" onclick="fazerLogin()">ENTRAR</button><p style="font-size:10px;color:#666;margin-top:8px">Senha: Naulangue</p></div>
<div id="adminContent" style="display:none">
<div class="adminCard" style="border-color:#00c853"><h3>➕ Publicar</h3>
<select id="pGrupo" class="sel">
<option value="Camisa m-comprida">👕 Camisa m-comprida</option>
<option value="Camisas">👕 Camisas</option>
<option value="Calções">🩳 Calções</option>
<option value="Calças">👖 Calças</option>
<option value="Calcinhas">👙 Calcinhas</option>
<option value="Colar">📿 Colar</option>
<option value="Sapatos">👟 Sapatos</option>
<option value="Saltos">👠 Saltos</option>
<option value="Vestidos">👗 Vestidos</option>
<option value="Óculos">🕶️ Óculos</option>
<option value="Outras roupas">👚 Outras roupas</option>
<option value="Delgados">Delgados</option>
</select>
<input type="file" id="fileInput" accept="image/*" multiple class="inp"><div id="previewWrap" class="previewWrap"></div><input id="pNome" class="inp" placeholder="Nome"><input id="pPreco" class="inp" type="number" placeholder="Preço"><button id="btnPublicar" class="btnAdmin" onclick="publicarAuto()">📤 PUBLICAR</button></div>
<div class="adminCard"><h3>📦 Produtos (<span id="countProd">0</span>)</h3><div id="adminList"></div></div>
</div></div>
<script>
let db,products=[],curImgs=[];
const WHATSAPP_NUMBER = '258846661893';
function initDB(){let req=indexedDB.open('MafiosoStore',6);req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('produtos'))e.target.result.createObjectStore('produtos',{keyPath:'id',autoIncrement:true})};req.onsuccess=e=>{db=e.target.result;carregarProdutos()};}
function carregarProdutos(){let tx=db.transaction('produtos','readonly');let req=tx.objectStore('produtos').getAll();req.onsuccess=()=>{products=req.result.reverse();render()};}
function salvarNoDB(prod){let tx=db.transaction('produtos','readwrite');tx.objectStore('produtos').add(prod);tx.oncomplete=()=>{carregarProdutos()};}
initDB();
function abrirWhatsApp(){window.open('https://wa.me/'+WHATSAPP_NUMBER+'?text=Olá NAULANGUE-SHOP! Quero fazer encomenda','_blank');}
function render(){let c=document.getElementById('allSections');if(products.length===0){c.innerHTML='<div style="padding:30px;text-align:center;color:#666;font-size:11px">Nenhum produto ainda.</div>';document.getElementById('countProd').innerText='0';return;}c.innerHTML='';let grupos={};products.forEach((pr,idx)=>{let g=pr.grupo||'Outras roupas';if(!grupos[g])grupos[g]=[];grupos[g].push({pr,idx})});Object.keys(grupos).forEach(cat=>{let h='<div class="sec"><h2>'+cat+'</h2><div class="grid">';grupos[cat].forEach(it=>{let pr=it.pr;let img=pr.img?'<img src="'+pr.img+'">':'Foto';h+='<div class="card"><span class="badge">NAULANGUE</span><div class="img">'+img+'</div><h3>'+pr.n+'</h3><div class="preco">'+pr.p+' MT</div><button class="btnWhatsCard" onclick="comprarWhats('+it.idx+')">💬 WhatsApp 846661893</button></div>';});h+='</div></div>';c.innerHTML+=h;});document.getElementById('countProd').innerText=products.length;let list=document.getElementById('adminList');list.innerHTML='';products.forEach(pr=>{list.innerHTML+='<div style="display:flex;gap:8px;background:#2a2a2a;border-radius:10px;padding:8px;margin-bottom:6px"><div style="flex:1"><b>'+pr.n+'</b> '+pr.grupo+'<br>'+pr.p+' MT</div><button onclick="apagar('+pr.id+')" style="background:#ff0040;color:#fff;border:none;border-radius:6px;padding:6px 10px">X</button></div>';});}
function comprarWhats(i){let pr=products[i];window.open('https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent('Olá NAULANGUE-SHOP! Quero: '+pr.n+' - '+pr.p+' MT - 846661893'),'_blank');}
function abrirAdmin(){document.getElementById('adminPanel').style.display='block';}
function fecharAdmin(){document.getElementById('adminPanel').style.display='none';}
function fazerLogin(){let s=document.getElementById('passInput').value;let k='TmF1bGFuZ3Vl';if(btoa(s)===k){document.getElementById('loginDiv').style.display='none';document.getElementById('adminContent').style.display='block';}else{alert('Senha errada!');}}
function comprimir(file,max,qual,cb){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);cb(canvas.toDataURL('image/jpeg',qual))};img.src=e.target.result};r.readAsDataURL(file);}
document.getElementById('fileInput').addEventListener('change',e=>{let files=Array.from(e.target.files);curImgs=[];let wrap=document.getElementById('previewWrap');wrap.innerHTML='';files.forEach(f=>{comprimir(f,350,0.55,url=>{curImgs.push(url);let d=document.createElement('div');d.className='previewBox';d.innerHTML='<img src="'+url+'">';wrap.appendChild(d);});});});
function publicarAuto(){let nome=document.getElementById('pNome').value.trim()||'Produto';let p=parseInt(document.getElementById('pPreco').value);let grupo=document.getElementById('pGrupo').value;if(!p){alert('Preço!');return;}if(curImgs.length===0){alert('Foto!');return;}curImgs.forEach((img,i)=>{let n=curImgs.length>1?nome+' '+(i+1):nome;salvarNoDB({n:n,p:p,img:img,grupo:grupo});});setTimeout(()=>{document.getElementById('pNome').value='';document.getElementById('pPreco').value='';curImgs=[];document.getElementById('previewWrap').innerHTML='';alert('Publicado!');fecharAdmin();},500);}
function apagar(id){if(confirm('Apagar?')){let tx=db.transaction('produtos','readwrite');tx.objectStore('produtos').delete(id);tx.oncomplete=()=>{carregarProdutos();};}}
</script>
</body>
</html>
